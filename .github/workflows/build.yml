name: Build KharidYar APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-22.04

    steps:

      # ======================================================
      # Checkout
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ======================================================
      # Java 17
      # ======================================================

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"


      # ======================================================
      # Python 3.11
      # ======================================================

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # ======================================================
      # System dependencies
      # ======================================================

      - name: Install system dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev \
            build-essential


      # ======================================================
      # Python dependencies
      # ======================================================

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install setuptools wheel
          python -m pip install buildozer
          python -m pip install "cython==0.29.36"


      # ======================================================
      # Clean previous build
      # ======================================================

      - name: Clean Buildozer
        run: |
          rm -rf .buildozer
          rm -rf bin


      # ======================================================
      # Build APK
      # ======================================================

      - name: Build APK
        run: |
          yes | buildozer android debug


      # ======================================================
      # Check APK
      # ======================================================

      - name: Check APK
        run: |
          echo "APK files:"
          find bin -type f -name "*.apk" -print


      # ======================================================
      # Upload APK
      # ======================================================

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KharidYar-APK
          path: bin/*.apk
          if-no-files-found: error
